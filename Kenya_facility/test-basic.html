<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kenya Facilities Map - Basic Test</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
        }
        
        #map {
            height: 100vh;
            width: 100%;
        }
        
        .header {
            background: #2c3e50;
            color: white;
            padding: 1rem;
            text-align: center;
            position: relative;
            z-index: 1000;
        }
        
        .header h1 {
            margin: 0;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="fas fa-map-marked-alt"></i> Kenya Facilities Map - Basic Test</h1>
    </div>
    <div id="map"></div>
    
    <script>
        // Simple map initialization for testing
        let map;
        
        function initSimpleMap() {
            try {
                console.log('Initializing simple map...');
                
                // Initialize the map centered on Kenya
                map = L.map('map').setView([1.2921, 36.8219], 6);

                // Add base layer
                const streets = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap contributors'
                });
                streets.addTo(map);

                // Add a test marker
                const testMarker = L.marker([1.2921, 36.8219]).addTo(map);
                testMarker.bindPopup('<b>Nairobi</b><br>Test marker for basic functionality');
                
                console.log('Simple map initialized successfully');
                
            } catch (error) {
                console.error('Error initializing simple map:', error);
                alert('Error loading map: ' + error.message);
            }
        }
        
        // Initialize when DOM is ready
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded, initializing simple map...');
            initSimpleMap();
        });
    </script>
</body>
</html>
